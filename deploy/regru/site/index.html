<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Private Rooms — Invitation only</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141d2f;--border:#2a3650;--text:#f0f5fa;--muted:#a6b4c6;--accent:#64e5c3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 5%,#1b3040 0%,transparent 52%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:28px}
main{width:min(100%,600px)}
header{display:flex;align-items:center;gap:11px;margin-bottom:52px;font-weight:750;letter-spacing:.01em}
mark{display:inline-grid;place-items:center;background:var(--accent);color:#09221f;width:36px;height:36px;border-radius:12px;font-weight:800;font-size:19px}
small{display:block;color:var(--accent);font-size:.76rem;font-weight:750;letter-spacing:.18em;text-transform:uppercase}
h1{font-size:clamp(2.6rem,8vw,4.8rem);line-height:1.04;letter-spacing:-.06em;margin:14px 0 20px;font-weight:770}
p{color:var(--muted);margin:0;max-width:460px}
section{background:rgba(20,29,47,.85);border:1px solid var(--border);border-radius:24px;padding:24px;margin-top:42px;box-shadow:0 14px 38px #0002}
section strong{display:block;margin-bottom:6px;font-size:1rem}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:10px;box-shadow:0 0 0 5px #64e5c318}
footer{margin-top:26px;color:#8090a7;font-size:.83rem}
@media(max-width:480px){header{margin-bottom:44px}section{margin-top:34px}h1{letter-spacing:-.045em}}
@media(prefers-reduced-motion:no-preference){section{animation:appear .45s ease both}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main>
<header><mark aria-hidden="true">P</mark><span>Private Rooms</span></header>
<small>Members only</small>
<h1>A quieter place<br>to connect.</h1>
<p>Private spaces for invited guests. No public directory, no open registration, no unnecessary distractions.</p>
<section aria-label="Access information"><strong><span class="dot" aria-hidden="true"></span>Invitation-based access</strong><p>If you have a valid invitation, open the address provided by your host.</p></section>
<footer>Private Rooms · Restricted access</footer>
</main>
</body>
</html>
