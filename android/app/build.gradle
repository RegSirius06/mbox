plugins {
    id 'com.android.application'
}

android {
    namespace 'io.mbox.android'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'io.mbox.android'
        minSdk 29
        targetSdk 36
        versionCode 6
        versionName '1.0.0-beta.3'

        manifestPlaceholders = [mboxProvisioningHost: providers.gradleProperty('mboxProvisioningHost').orElse('provision.invalid').get()]

        // The MBox Go core is currently built only for Android arm64.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // libmbox.so is a PIE executable rather than a JNI library. It must
            // be extracted to nativeLibraryDir so Android permits execve().
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            // Make the local UDP laboratory APK distinguishable from beta.3.
            versionNameSuffix '-udp-lab'
        }
    }
}

dependencies {
    implementation files('libs/hev-socks5-tunnel.aar')
    // Chromium-derived HTTPS stack used by the Android outer transport.
    // cronet-embedded is deprecated as of 500.x; bundled is the direct artifact.
    implementation 'org.chromium.net:cronet-bundled:500.1.0'
}
