name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GO_VERSION: '1.27.3'
  PYTHON_VERSION: '3.13'
  JAVA_VERSION: '17.0.21+9'
  ANDROID_API: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
jobs:
  go-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version: '${{ env.GO_VERSION }}', check-latest: false}
      - name: Format, vet, tests
        env: {GO111MODULE: 'off'}
        run: |
          test -z "$(find common/noise common/controlmeta client server relay tools/mbox-key tools/mbox-link tools/mbox-netprobe -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
          for d in common/noise common/controlmeta server client relay tools/mbox-key tools/mbox-link tools/mbox-netprobe; do (cd "$d" && go vet . && go test .); done
  go-race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version: '${{ env.GO_VERSION }}', check-latest: false}
      - name: Race tests
        env: {GO111MODULE: 'off'}
        run: |
          (cd common/noise && go test -race .)
          (cd common/controlmeta && go test -race .)
          (cd server && go test -race .)
          (cd client && go test -race .)
          (cd relay && go test -race .)
  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version: '${{ env.GO_VERSION }}', check-latest: false}
      - name: Fuzz parser smoke
        env: {GO111MODULE: 'off'}
        run: |
          (cd common/controlmeta && go test -run=^$ -fuzz=FuzzRejectTamperedControlMetadata -fuzztime=10s .)
          (cd server && go test -run=^$ -fuzz=FuzzDownRequestMeta -fuzztime=10s .)
          (cd server && go test -run=^$ -fuzz=FuzzControlQueryParser -fuzztime=10s .)
          (cd client && go test -run=^$ -fuzz=FuzzMuxFrameParser -fuzztime=10s .)
          (cd client && go test -run=^$ -fuzz=FuzzNoiseTransportRecord -fuzztime=10s .)
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The Android Cronet loopback pool regression compiles and executes
      # real Java code; do not silently skip it when the runner lacks a JDK.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: '${{ env.JAVA_VERSION }}'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '${{ env.PYTHON_VERSION }}'}
      - run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - run: python -m pytest -q tests
      - run: python tools/check-source-layout.py
      - run: python -m py_compile tools/mboxctl/mboxctl.py && bash -n install.sh android/tools/*.sh tools/*.sh
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version: '${{ env.GO_VERSION }}', check-latest: false}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: '${{ env.JAVA_VERSION }}'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        # setup-android's default "tools platform-tools" includes the removed "tools" package.
        with:
          packages: 'platform-tools'
      - run: yes | sdkmanager --licenses >/dev/null; sdkmanager "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}"
      - run: cd android && ./tools/build-debug.sh
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - run: ./tools/secret-scan.sh
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
  long-transport:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version: '${{ env.GO_VERSION }}', check-latest: false}
      - name: 3 GiB transport scheduler under race
        env: {GO111MODULE: 'off', MBOX_LONG_TEST: '1'}
        run: cd client && go test -race -run TestMultiGBUploadChunking -timeout 30m .
